name: Main
on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1.8.1

      - run: dart pub get
      - run: ./scripts/build
      - run: git checkout packages/mastodon_generator/lib/mastodon_generator.dart # avoid diff due to generated timestamp
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Git changes detected after build"
            git status
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

      - uses: dart-lang/setup-dart@v1.8.1
      - run: dart pub get
      - run: ./scripts/analyze

  main-required:
    if: ${{ !cancelled() }}
    needs: [build, lint]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
